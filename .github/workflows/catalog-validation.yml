name: Catalog validation

on:
  pull_request:
    paths:
      - "catalog/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/catalog-validation.yml"
  push:
    branches:
      - main
    paths:
      - "catalog/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate canonical catalog and fixtures
        run: npm test

      - name: Validate canonical catalog
        run: npm run validate

      - name: Validate immutability against pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "${BASE_SHA}:catalog/v1/catalog.json" 2>/dev/null; then
            git show "${BASE_SHA}:catalog/v1/catalog.json" > /tmp/partybeam-base-catalog.json
            npm run validate -- --baseline /tmp/partybeam-base-catalog.json
          else
            echo "Base commit has no v1 catalog; skipping historical immutability comparison."
          fi

      - name: Validate immutability against previous main revision
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          if git cat-file -e "${BASE_SHA}:catalog/v1/catalog.json" 2>/dev/null; then
            git show "${BASE_SHA}:catalog/v1/catalog.json" > /tmp/partybeam-base-catalog.json
            npm run validate -- --baseline /tmp/partybeam-base-catalog.json
          else
            echo "Previous revision has no v1 catalog; skipping historical immutability comparison."
          fi
